name: pkgdown

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
      
      - name: Checkout FSSgam package repository
        uses: actions/checkout@v4
        with:
          repository: beckyfisher/FSSgam_package
          path: FSSgam

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: |
            any::pkgdown
            any::remotes

      - name: Install FSSgam package from GitHub
        run: remotes::install_github("beckyfisher/FSSgam_package")
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"

      - name: Build pkgdown site
        run: |
          pkgdown::build_site(
            pkg = "FSSgam",
            path = "docs",
            new_process = FALSE
          )
        shell: Rscript {0}

      - name: Check pkgdown output
        run: ls -R docs
              
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs