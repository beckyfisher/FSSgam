name: pkgdown

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: |
            any::pkgdown
            any::remotes
            local::.

      # Install the real package so examples in articles/reference can run.
      # Every branch builds against FSSgam_package's dev branch, named here
      # explicitly rather than left to that repo's default. Its default is
      # currently dev, so the previous `ref = NULL` resolved there anyway, but
      # that is a property of the other repo and would change without warning
      # if its default moved. RF, 2026-09-07.
      - name: Install FSSgam package from GitHub
        run: |
          remotes::install_github("beckyfisher/FSSgam_package", ref = "dev")
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # pkgdown renders every .md in the package root as a site page, with no
      # opt-out: package_mds() skips only README/NEWS/LICENCE and a short fixed
      # list, and does not consult .Rbuildignore. CLAUDE.md is internal working
      # notes and was being published at /CLAUDE.html. Removing it from the
      # checkout before the build keeps it out of the pages, and out of
      # search.json and llms.txt with them. The repository file is untouched.
      - name: Keep internal notes out of the built site
        run: rm -f CLAUDE.md

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Check pkgdown output
        run: ls -R docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true