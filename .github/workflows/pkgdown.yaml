name: pkgdown

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: |
            any::pkgdown
            any::remotes
            local::.

      # Install the real package so the vignettes can run. The root site, built
      # from this repo's master, renders against the CRAN release, so a reader
      # who runs install.packages("FSSgam") reproduces the numbers shown. The
      # /dev/ site, built from this repo's dev, renders against FSSgam_package's
      # dev branch, named explicitly rather than left to that repo's default
      # branch, which is a property of the other repo and could change without
      # warning. Keyed on this repo's branch, the same one DESCRIPTION's Version
      # tracks for the root-vs-/dev/ split. RF, 2026-09-29, after FSSgam 1.2.0
      # was published on CRAN; before that every branch installed dev.
      - name: Install FSSgam package
        run: |
          if (Sys.getenv("DOCS_BRANCH") == "dev") {
            remotes::install_github("beckyfisher/FSSgam_package", ref = "dev")
          } else {
            install.packages("FSSgam")
          }
          message("Building against FSSgam ", packageVersion("FSSgam"))
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          DOCS_BRANCH: ${{ github.ref_name }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # pkgdown renders every .md in the package root as a site page, with no
      # opt-out: package_mds() skips only README/NEWS/LICENCE and a short fixed
      # list, and does not consult .Rbuildignore. CLAUDE.md is internal working
      # notes and was being published at /CLAUDE.html. Removing it from the
      # checkout before the build keeps it out of the pages, and out of
      # search.json and llms.txt with them. The repository file is untouched.
      - name: Keep internal notes out of the built site
        run: rm -f CLAUDE.md

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # FSSgam.docs exports nothing, so pkgdown writes an empty reference index
      # that nothing links to: the navbar Reference component points at
      # FSSgam_package's own reference site instead. `build: reference: false`
      # in _pkgdown.yml is parsed but does not suppress the index, so remove it
      # after the build. RF, 2026-09-07.
      - name: Remove the empty reference index
        run: |
          rm -rf docs/reference docs/dev/reference
          # pkgdown writes the sitemap before this step runs, so the page it
          # just removed is still listed there. Matched as a fixed string on
          # the local path: the external FSSgam_package reference URL in
          # search.json and llms.txt has no index.html and is left alone.
          for f in docs/sitemap.xml docs/dev/sitemap.xml; do
            if [ -f "$f" ]; then
              grep -vF '/reference/index.html</loc>' "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
            fi
          done

      - name: Check pkgdown output
        run: ls -R docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true