name: pkgdown

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
          extra-packages: |
            any::pkgdown
            any::remotes
            local::.

      # Optional but recommended: install the real package
      # so examples in articles/reference can run.
      # The dev branch builds against FSSgam_package's dev branch (where the
      # snake_case generate_model_set/fit_model_set rename lives); main/master
      # build against FSSgam_package's default branch.
      - name: Install FSSgam package from GitHub
        run: |
          ref <- if (Sys.getenv("GITHUB_REF_NAME") == "dev") "dev" else NULL
          remotes::install_github("beckyfisher/FSSgam_package", ref = ref)
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Check pkgdown output
        run: ls -R docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true